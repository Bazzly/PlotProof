<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  html, body { margin: 0; padding: 0; font-family: 'Work Sans', -apple-system, BlinkMacSystemFont, sans-serif; background: #f9f5ec; }
  #wrap { padding: 8px; box-sizing: border-box; }
  #map { width: 100%; border-radius: 12px; border: 1px solid #d4cdbf; }
  #bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 8px; flex-wrap: wrap; }
  #readout { font-size: 13px; color: #3b3129; }
  #confirmBtn {
    background: #104f29; color: #fff; border: none; border-radius: 999px;
    padding: 8px 18px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  #confirmBtn:hover { background: #0d3f21; }
  #hint { font-size: 12px; color: #845a0f; margin-top: 6px; }
  .pp-seg-label {
    background: #fbf8f1; border: 1px solid #d4cdbf; border-radius: 6px;
    padding: 1px 6px; font-size: 11px; color: #25170c; white-space: nowrap;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="map"></div>
  <div id="bar">
    <span id="readout">Drag the blue marker onto your plot</span>
    <button id="confirmBtn" type="button">Confirm this position</button>
  </div>
  <div id="hint">Search above to jump to your area. Drag the blue origin marker to move the whole shape at once; drag any green corner on its own to fine-tune just that point against the satellite image.</div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const METERS_PER_DEG_LAT = 111320.0;

  let map = null;
  let polygon = null;
  let vertexMarkers = [];   // one draggable L.marker per vertex - index 0 is the origin
  let segLabels = [];       // one non-interactive L.marker(divIcon) per edge, at its midpoint
  let currentLatLngs = null; // [[lat, lon], ...] - the live, possibly per-vertex-adjusted shape
  let currentArgs = null;

  function toLatLon(originLat, originLon, easting, northing) {
    const metersPerDegLon = METERS_PER_DEG_LAT * Math.cos(originLat * Math.PI / 180);
    return [originLat + northing / METERS_PER_DEG_LAT, originLon + easting / metersPerDegLon];
  }

  // Real bearing/distance between two CURRENT lat/lon vertices - same
  // flat-earth approximation and whole-circle-bearing convention as
  // utils/map_traverse_sketch.py's own bearingDistance(), so a shape's
  // edge labels read the same way whichever tool produced or is now
  // displaying it.
  function bearingDistance(fromLL, toLL) {
    const metersPerDegLon = METERS_PER_DEG_LAT * Math.cos(fromLL[0] * Math.PI / 180);
    const dNorthing = (toLL[0] - fromLL[0]) * METERS_PER_DEG_LAT;
    const dEasting = (toLL[1] - fromLL[1]) * metersPerDegLon;
    const distance = Math.sqrt(dNorthing * dNorthing + dEasting * dEasting);
    let bearing = Math.atan2(dEasting, dNorthing) * 180 / Math.PI;
    bearing = (bearing + 360) % 360;
    return { bearing, distance };
  }

  function formatBearing(deg) {
    let whole = Math.floor(deg);
    let minutes = Math.round((deg - whole) * 60);
    if (minutes === 60) { whole += 1; minutes = 0; }
    return whole + "°" + String(minutes).padStart(2, "0") + "'";
  }

  function segLabelIcon(text) {
    return L.divIcon({ className: "", html: '<div class="pp-seg-label">' + text + "</div>", iconSize: null });
  }

  function redrawSegmentLabels() {
    segLabels.forEach((m) => map.removeLayer(m));
    segLabels = [];
    const n = currentLatLngs.length;
    for (let i = 0; i < n; i++) {
      const from = currentLatLngs[i];
      const to = currentLatLngs[(i + 1) % n];
      const { bearing, distance } = bearingDistance(from, to);
      const mid = [(from[0] + to[0]) / 2, (from[1] + to[1]) / 2];
      segLabels.push(
        L.marker(mid, { icon: segLabelIcon(formatBearing(bearing) + " · " + distance.toFixed(2) + "m"), interactive: false }).addTo(map)
      );
    }
  }

  function nodeIcon(isOrigin) {
    const color = isOrigin ? "#104f29" : "#0ca30c";
    const size = isOrigin ? 18 : 14;
    return L.divIcon({
      className: "",
      html: `<div style="width:${size}px;height:${size}px;border-radius:50%;background:${color};border:2px solid #fff;box-shadow:0 0 2px rgba(0,0,0,.5);"></div>`,
      iconSize: [size, size],
      iconAnchor: [size / 2, size / 2],
    });
  }

  function updateReadout() {
    const origin = currentLatLngs[0];
    const originLabel = (currentArgs.labels && currentArgs.labels[0]) || "PL1";
    document.getElementById("readout").innerText =
      "Origin (" + originLabel + "): " + origin[0].toFixed(6) + ", " + origin[1].toFixed(6);
  }

  function redrawPolygon() {
    if (!polygon) {
      polygon = L.polygon(currentLatLngs, { color: "#104f29", fillColor: "#104f29", fillOpacity: 0.25 }).addTo(map);
    } else {
      polygon.setLatLngs(currentLatLngs);
    }
    redrawSegmentLabels();
  }

  // Rebuilds the whole shape at a new origin position - used on first load
  // and whenever a fresh area search recenters the widget (never mid-drag,
  // which would silently discard any per-vertex adjustments already made).
  function resetShape(originLat, originLon) {
    currentLatLngs = currentArgs.vertices_en.map(([e, n]) => toLatLon(originLat, originLon, e, n));
    redrawPolygon();
    createOrMoveMarkers();
    updateReadout();
  }

  function createOrMoveMarkers() {
    vertexMarkers.forEach((m) => map.removeLayer(m));
    vertexMarkers = currentLatLngs.map((ll, i) => {
      const label = (currentArgs.labels && currentArgs.labels[i]) || ("point " + (i + 1));
      const marker = L.marker(ll, { draggable: true, icon: nodeIcon(i === 0) })
        .bindTooltip(label)
        .addTo(map);

      marker.on("drag", (e) => {
        const newLL = e.target.getLatLng();
        if (i === 0) {
          // Origin drag - shift the whole current shape (including any
          // earlier per-vertex tweaks) by the same delta, rather than
          // rebuilding from the original relative offsets - a corner
          // already fine-tuned shouldn't snap back when you reposition
          // the group.
          const prev = currentLatLngs[0];
          const dLat = newLL.lat - prev[0];
          const dLng = newLL.lng - prev[1];
          currentLatLngs = currentLatLngs.map((ll2, j) =>
            j === 0 ? [newLL.lat, newLL.lng] : [ll2[0] + dLat, ll2[1] + dLng]
          );
          vertexMarkers.forEach((mk, j) => {
            if (j !== 0) mk.setLatLng(currentLatLngs[j]);
          });
        } else {
          currentLatLngs[i] = [newLL.lat, newLL.lng];
        }
        redrawPolygon();
        updateReadout();
      });
      return marker;
    });
  }

  function setFrameHeight() {
    const height = document.documentElement.scrollHeight;
    window.parent.postMessage({ isStreamlitMessage: true, type: "streamlit:setFrameHeight", height: height }, "*");
  }

  // A one-shot setFrameHeight() right after init (below) reads a stale,
  // often-zero height if this component is rendered inside something that
  // starts hidden (e.g. a collapsed st.expander - exactly
  // _render_georeference_picker()'s own default) and only becomes visible
  // later - nothing would ever correct it otherwise. A ResizeObserver on
  // <body> catches the moment a hidden ancestor's collapse actually
  // changes this element's real size (expander opening, markers/labels
  // added or removed, map height itself changing) and reports it fresh.
  new ResizeObserver(() => setFrameHeight()).observe(document.body);

  function initMap(args) {
    const mapDiv = document.getElementById("map");
    mapDiv.style.height = (args.height || 480) + "px";

    map = L.map("map").setView([args.center_lat, args.center_lon], args.zoom || 16);
    const street = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap contributors",
    }).addTo(map);
    const satellite = L.tileLayer(
      "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
      { attribution: "Esri, Maxar, Earthstar Geographics" }
    );
    L.control.layers({ "Street": street, "Satellite": satellite }).addTo(map);

    resetShape(args.center_lat, args.center_lon);
    setTimeout(setFrameHeight, 50);
  }

  document.getElementById("confirmBtn").addEventListener("click", () => {
    if (!currentLatLngs) return;
    window.parent.postMessage({
      isStreamlitMessage: true,
      type: "streamlit:setComponentValue",
      value: { vertices: currentLatLngs.map(([lat, lon]) => ({ lat: lat, lon: lon })) },
      dataType: "json",
    }, "*");
  });

  window.addEventListener("message", (event) => {
    if (!event.data || event.data.type !== "streamlit:render") return;
    const args = event.data.args;

    if (!map) {
      currentArgs = args;
      initMap(args);
      return;
    }

    const prevArgs = currentArgs;
    currentArgs = args;
    const centerChanged = prevArgs.center_lat !== args.center_lat || prevArgs.center_lon !== args.center_lon;
    const verticesChanged = JSON.stringify(prevArgs.vertices_en) !== JSON.stringify(args.vertices_en);

    if (centerChanged) {
      // A fresh area search - a just-found place is usually passed with a
      // tighter zoom than the initial wide country view, so re-zoom too,
      // not just pan. Resets any per-vertex adjustments already made -
      // acceptable here since jumping to a whole new area means the old
      // adjustments were against the wrong place anyway.
      map.setView([args.center_lat, args.center_lon], args.zoom || map.getZoom());
      resetShape(args.center_lat, args.center_lon);
    } else if (verticesChanged) {
      // The underlying bearing/distance legs changed (the user edited the
      // table above) - rebuild at the origin's CURRENT position (keeping
      // that placement) but from the new shape, discarding per-vertex
      // tweaks made against the now-stale old shape.
      const originLL = currentLatLngs[0];
      resetShape(originLL[0], originLL[1]);
    }
    setFrameHeight();
  });

  window.parent.postMessage({ isStreamlitMessage: true, type: "streamlit:componentReady", apiVersion: 1 }, "*");
</script>
</body>
</html>
